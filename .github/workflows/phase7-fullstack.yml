name: Project-first full-stack gate
on:
  pull_request:
    branches: [main, feat/ui-ux-overhaul, 'codex/**']
  push:
    branches: [main, feat/full-product-fe-nest-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase7-fullstack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sql2019:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIVE_BE_ROOT: ${{ github.workspace }}/V-INTERN-BE
      # Update only through a reviewed compatibility PR; see docs/testing/project-first-fullstack-gate.md.
      COMPATIBLE_BE_SHA: 78f44b43dfdff5e0397564d8ba2c68ab1b262e7a
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "1433"
      DB_NAME: VIntern_Phase715_CI_${{ github.run_id }}_${{ github.run_attempt }}
      E2E_DB_NAME: VIntern_Phase715_CI_${{ github.run_id }}_${{ github.run_attempt }}
      DB_USERNAME: vintern_ci
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_EXPIRES_IN: 20s
      CORS_ORIGINS: http://localhost:3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      THROTTLE_AUTH_PER_MIN: "10000"
      THROTTLE_LIMIT_PER_MIN: "10000"
      THROTTLE_INTERVIEW_START_PER_MIN: "10000"
      THROTTLE_INTERVIEW_SUBMIT_PER_MIN: "10000"
      THROTTLE_INTERVIEW_CHAT_PER_MIN: "10000"
      THROTTLE_EVALUATION_PER_MIN: "10000"
      THROTTLE_AI_MENTOR_PER_MIN: "10000"
      THROTTLE_AI_EVALUATION_ASSIST_PER_MIN: "10000"
      THROTTLE_AI_RECOMMENDATION_PER_MIN: "10000"
      THROTTLE_AI_GENERATION_PER_MIN: "10000"
      REQUIRE_SQL2019: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: V-INTERN-FE
          persist-credentials: false
      - name: Checkout exact Backend contract SHA (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: vanhoi04082006-pixel/V-Intern-BE
          ref: ${{ env.COMPATIBLE_BE_SHA }}
          path: V-INTERN-BE
          ssh-key: ${{ secrets.PHASE7_BE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            V-INTERN-FE/package-lock.json
            V-INTERN-BE/package-lock.json
      - name: FE quality gates
        working-directory: V-INTERN-FE
        run: |
          unset NODE_ENV
          npm ci
          npm run lint
          npm run typecheck
          npm test
          node --test scripts/__tests__/*.test.mjs
          npm audit --omit=dev --audit-level=high
          npm run build
          # Artifacts must contain only evidence generated by this exact run.
          node -e 'require("node:fs").rmSync("phase7-evidence", { recursive: true, force: true })'
          node scripts/phase7-runtime-audit.mjs
          git diff --check
      - name: Install and build real Nest
        working-directory: V-INTERN-BE
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Generate masked disposable credentials
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="S3cure!$(openssl rand -hex 16)Aa1"
          DB_PASSWORD="S3cure!$(openssl rand -hex 16)Aa1"
          JWT_SECRET="$(openssl rand -hex 32)"
          LIVE_PASSWORD="S3cure!$(openssl rand -hex 16)Aa1"
          GITHUB_TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          for value in "$SA_PASSWORD" "$DB_PASSWORD" "$JWT_SECRET" "$LIVE_PASSWORD" "$GITHUB_TOKEN_ENCRYPTION_KEY"; do echo "::add-mask::$value"; done
          { echo "SA_PASSWORD=$SA_PASSWORD"; echo "DB_PASSWORD=$DB_PASSWORD"; echo "JWT_SECRET=$JWT_SECRET"; echo "LIVE_PASSWORD=$LIVE_PASSWORD"; echo "GITHUB_TOKEN_ENCRYPTION_KEY=$GITHUB_TOKEN_ENCRYPTION_KEY"; } >> "$GITHUB_ENV"
      - name: Boot SQL Server 2019 and poll readiness
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name phase7-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2019-latest
          deadline=$((SECONDS+180))
          until docker exec phase7-sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q 'SELECT 1' >/dev/null 2>&1 || docker exec phase7-sql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q 'SELECT 1' >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'SQL startup failed'; exit 1; fi
            sleep 2
          done
      - name: Create disposable database and apply all configured product migrations
        working-directory: V-INTERN-BE
        env:
          DB_ADMIN_USERNAME: sa
          DB_ADMIN_PASSWORD: ${{ env.SA_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ../V-INTERN-FE/phase7-evidence/logs
          npm run db:create:e2e
          npm run migration:run 2>&1 | tee ../V-INTERN-FE/phase7-evidence/logs/migration-run.log
          npm run migration:show 2>&1 | tee ../V-INTERN-FE/phase7-evidence/logs/migration-show.log
          node ../V-INTERN-FE/scripts/project-first-migrations.mjs
          npm run audit:schema 2>&1 | tee ../V-INTERN-FE/phase7-evidence/logs/schema-audit.log
      - name: Install browser
        working-directory: V-INTERN-FE
        run: npx playwright install --with-deps chrome
      - name: Boot real Next and Nest with explicit test-only external providers
        working-directory: V-INTERN-FE
        run: |
          node scripts/phase715-nest-harness.mjs > /tmp/phase7-nest.log 2>&1 &
          echo $! > /tmp/phase7-nest.pid
          NODE_ENV=production npm run start > /tmp/phase7-next.log 2>&1 &
          echo $! > /tmp/phase7-next.pid
          { git rev-parse HEAD; git -C ../V-INTERN-BE rev-parse HEAD; } > phase7-evidence/final/paired-heads.txt
          node scripts/phase7-runtime-ready.mjs
      - name: 01 - Create disposable application fixtures
        working-directory: V-INTERN-FE
        run: node scripts/phase715-dev-fixtures.mjs
      - name: 02 - Recruitment, interview and authentication
        working-directory: V-INTERN-FE
        run: node scripts/phase715-live-browser.mjs
      - name: 03 - Student work, submissions and concurrency
        working-directory: V-INTERN-FE
        run: node scripts/phase7-work-live.mjs
      - name: 04 - Create outcome fixtures
        working-directory: V-INTERN-FE
        run: node scripts/phase7-outcomes-fixture.mjs
      - name: 05 - Student outcomes and certificates
        working-directory: V-INTERN-FE
        run: node scripts/phase7-outcomes-live.mjs
      - name: 06 - Project library, team, AI draft and publication
        working-directory: V-INTERN-FE
        run: node scripts/project-first-live.mjs
      - name: 07 - Instructor evaluation, review and reports
        working-directory: V-INTERN-FE
        run: node scripts/phase7-instructor-live.mjs
      - name: 08 - Administrator workflows
        working-directory: V-INTERN-FE
        run: node scripts/phase7-admin-live.mjs
      - name: Dynamic career catalog acceptance
        working-directory: V-INTERN-FE
        run: node scripts/career-roles-live.mjs
      - name: Knowledge authoring acceptance
        working-directory: V-INTERN-FE
        run: node scripts/knowledge-library-live.mjs

      - name: G2 mini-project authoring and pinned learner package
        working-directory: V-INTERN-FE
        run: node scripts/mini-project-library-live.mjs
      - name: 09 - Role navigation and routes
        working-directory: V-INTERN-FE
        run: node scripts/phase7-navigation-live.mjs
      - name: 10 - Authentication acceptance
        working-directory: V-INTERN-FE
        run: node scripts/phase7-uat-auth-live.mjs
      - name: 11 - UI, keyboard and responsive acceptance
        working-directory: V-INTERN-FE
        run: node scripts/phase7-uat-ui-live.mjs
      - name: 12 - Negative authorization and isolation
        working-directory: V-INTERN-FE
        run: node scripts/phase7-uat-negative-live.mjs
      - name: 13 - Create KPI and salary acceptance fixtures
        working-directory: V-INTERN-FE
        run: node scripts/phase7-uat-finance-fixture.mjs
      - name: 14 - KPI, salary and UTC boundary acceptance
        working-directory: V-INTERN-FE
        run: node scripts/phase7-uat-finance-live.mjs
      - name: Collect startup and SQL logs
        if: always()
        shell: bash
        run: |
          mkdir -p V-INTERN-FE/phase7-evidence/logs
          for service in nest next; do
            if [ -f "/tmp/phase7-$service.log" ]; then cp "/tmp/phase7-$service.log" "V-INTERN-FE/phase7-evidence/logs/$service.log"; fi
          done
          docker logs phase7-sql > V-INTERN-FE/phase7-evidence/logs/sql-startup.log 2>&1 || true
      - name: Clean up owned disposable services
        if: always()
        shell: bash
        run: |
          for service in nest next; do
            if [ -f "/tmp/phase7-$service.pid" ]; then kill "$(cat "/tmp/phase7-$service.pid")" 2>/dev/null || true; fi
          done
          docker rm -f phase7-sql >/dev/null 2>&1 || true
      - name: Upload sanitized browser/SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-real-sql2019-${{ github.sha }}
          path: V-INTERN-FE/phase7-evidence/
          retention-days: 14
